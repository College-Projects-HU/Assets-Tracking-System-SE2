spring.application.name=report-service
spring.main.allow-bean-definition-overriding=true

# Feign client URLs (override in docker / env as needed)
feign.asset-service.url=http://localhost:8082
feign.maintenance-service.url=http://localhost:8085
feign.assignment-service.url=http://localhost:8082
server.port=8084
spring.config.import=optional:configserver:${SPRING_CONFIG_SERVER_URI:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
