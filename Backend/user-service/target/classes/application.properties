server.port=8083
spring.application.name=user-service
spring.config.import=optional:configserver:${SPRING_CONFIG_SERVER_URI:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
jwt.secret=${JWT_SECRET:your_super_secret_key_that_should_be_at_least_256_bits_long_for_HS256_algorithm_in_production}
feign.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
management.endpoints.web.exposure.include=health,info
