# ─────────────────────────────────────────────────────────────────
#  DEVELOPMENT compose — runs ONLY infrastructure
#  Start with:  docker compose -f docker-compose.dev.yml up -d
#
#  Then run the service you are working on locally:
#    ./mvnw spring-boot:run -pl auth-service \
#      -Dspring-boot.run.jvmArguments="-DSPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/assets_auth_db -DSPRING_DATASOURCE_USERNAME=postgres -DSPRING_DATASOURCE_PASSWORD=postgres -DEUREKA_URL=http://localhost:8761/eureka/ -DCONFIG_SERVER_URL=http://localhost:8888"
# ─────────────────────────────────────────────────────────────────

services:

  # ─── Database ───
  postgres:
    image: postgres:15-alpine
    container_name: asset-tracking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: assets_auth_db
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asset-tracking-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - dev-net

  # ─── Config Server ───
  config-server:
    image: ats/config-server:1.0.0
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # ─── Eureka Server ───
  eureka-server:
    image: ats/eureka-server:1.0.0
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

volumes:
  pgdata-dev:
    driver: local

networks:
  dev-net:
    driver: bridge
