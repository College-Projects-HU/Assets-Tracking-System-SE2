spring.datasource.url=jdbc:postgresql://localhost:5432/assets_report_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Feign URLs for report-service outbound calls (used in local dev via config server)
# In Docker these are overridden by ASSET_SERVICE_URL / MAINTENANCE_SERVICE_URL env vars
feign.asset-service.url=http://localhost:8082
feign.maintenance-service.url=http://localhost:8085
feign.assignment-service.url=http://localhost:8082
