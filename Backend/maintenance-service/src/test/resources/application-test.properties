spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:maintenance-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
jwt.secret=your_super_secret_key_that_should_be_at_least_256_bits_long_for_HS256_algorithm_in_production
feign.asset-service.url=http://localhost:8082
